honeypot:
  name: "CyberHoney"
  host: "0.0.0.0"
  
services:
  ssh:
    enabled: true
    port: 2222
    banner: "SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5"
  
  ftp:
    enabled: true
    port: 2121
    banner: "220 Welcome to FTP Server"
  
  http:
    enabled: true
    port: 8080
    ssl_enabled: false
    ssl_port: 8443
  
database:
  type: "sqlite"
  path: "data/honeypot.db"
  
logging:
  level: "INFO"
  file: "logs/honeypot.log"
  max_size: 10485760
  backup_count: 5
  
api:
  enabled: true
  port: 5000
  allowed_ips:
    - "127.0.0.1"
    - "::1"

rate_limiting:
  max_connections: 10
  max_credentials: 5
  time_window: 60
  block_duration: 300
  
  response_delay:
    enable: true
    base_ms: 1000
    max_ms: 10000
  
  tarpit:
    enable: true
    threshold: 10